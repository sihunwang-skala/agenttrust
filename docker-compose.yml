# Local demo only. Ports are bound to localhost; there is no authentication.
services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      AGENTTRUST_ALLOW_DEMO_RESET: "true"
      AGENTTRUST_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes: ["agenttrust-data:/data"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
volumes:
  agenttrust-data:
